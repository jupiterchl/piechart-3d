<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 饼图示例</title>
    <!-- 相对路径，兼容 GitHub Pages 的 /<repo>/ 子路径 -->
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div class="layout">
      <!-- 左侧：原生示例 + Vue 2 / Vue 3 示例 -->
      <main class="stage">
        <section class="demo-card demo-card--wide">
          <header class="demo-card__title">
            <span>原生调用</span>
            <button type="button" class="demo-card__code" data-example="native">示例代码</button>
          </header>
          <div id="native-chart" class="chart-mount"></div>
        </section>

        <section class="demo-card">
          <header class="demo-card__title">
            <span>Vue 2 组件</span>
            <button type="button" class="demo-card__code" data-example="vue2">示例代码</button>
          </header>
          <div class="chart-mount">
            <!-- Vue 2 挂载后会替换该节点 -->
            <div id="vue-chart"></div>
          </div>
        </section>

        <section class="demo-card">
          <header class="demo-card__title">
            <span>Vue 3 组件</span>
            <button type="button" class="demo-card__code" data-example="vue3">示例代码</button>
          </header>
          <div class="chart-mount">
            <!-- Vue 3 会保留挂载容器，需显式撑满 -->
            <div id="vue3-chart" class="chart-host"></div>
          </div>
        </section>
      </main>

      <!-- 右侧：实时配置面板（Tweakpane） -->
      <aside class="panel">
        <div id="config-panel"></div>
        <p id="data-status" class="data-status" hidden></p>
      </aside>
    </div>

    <!-- 示例代码弹窗 -->
    <div id="code-overlay" class="export-overlay" hidden>
      <div class="export-dialog" role="dialog" aria-modal="true" aria-labelledby="code-title">
        <header class="export-dialog__header">
          <h2 id="code-title">示例代码</h2>
          <button type="button" id="code-close" class="export-dialog__close" aria-label="关闭">×</button>
        </header>
        <p id="code-hint" class="export-dialog__hint"></p>
        <pre class="export-code"><code id="code-content" class="hljs"></code></pre>
        <footer class="export-dialog__footer">
          <button type="button" id="code-copy" class="export-btn export-btn--primary">复制代码</button>
          <button type="button" id="code-copy-config" class="export-btn">复制配置</button>
          <span id="code-status" class="export-status" role="status"></span>
        </footer>
      </div>
    </div>

    <!-- 相对路径，兼容 GitHub Pages 的 /<repo>/ 子路径 -->
    <script src="./dist/build.js"></script>
  </body>
</html>
